services:
  postgres:
    image: postgres:15-alpine
    container_name: simulab-postgres
    environment:
      POSTGRES_USER: simulab
      POSTGRES_PASSWORD: simulab
      POSTGRES_DB: simulab
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simulab

  redis:
    image: redis:7-alpine
    container_name: simulab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simulab

volumes:
  postgres_data:
  redis_data:

networks:
  simulab:
    driver: bridge
